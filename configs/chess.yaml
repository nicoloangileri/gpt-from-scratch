# Chess action-value run. Overrides work the same way as configs/config.yaml:
#   python -m src.train_chess --max_steps 50000 --batch_size 512

seed: 1337
device: cuda
data_dir: data/chess

# --- model ---
n_layer: 8
n_head: 8
n_embd: 384
dropout: 0.0
bias: false
num_buckets: 64        # uniform bins over the Stockfish win probability
causal: true           # false = full attention (a position has no time axis)
triton_ln: false       # true = hand-written fused LayerNorm (LEVEL 3)

# --- optimizer / schedule ---
lr: 1.0e-3             # small vocab + short sequences take a higher LR than the LM
min_lr: 1.0e-4
warmup_steps: 1000
max_steps: 40000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

# --- batching ---
batch_size: 256        # sequences are 78 tokens, so batches can be much larger
grad_accum_steps: 1

# --- puzzle ranking loss (optional: empty puzzle_dir turns it off) ---
puzzle_dir: ""         # packed by src/puzzle_data.py, held-out puzzles excluded
rank_weight: 1.0       # 0 disables the term without unpacking the data
rank_batch: 64         # positions; each costs `num_candidates` sequences
rank_temp: 0.05        # win-probability difference that counts as one logit

# --- distillation (optional: empty distill_from turns it off) ---
# A frozen copy of a checkpoint; on every action-value batch the student also pays
# distill_weight x KL(teacher || student) over the 64 buckets. Meant for the puzzle
# fine-tune: the ranking loss moves the root, this holds the values elsewhere.
distill_from: ""
distill_weight: 1.0

# --- precision / speed ---
amp: true
dtype: bf16            # auto-falls back to fp16 on pre-Ampere GPUs (T4)
compile: false
max_ram_gb: 4.0      # packed states above this stay on disk (memmap) instead of RAM

# --- logging / eval / checkpoints ---
log_interval: 250
eval_interval: 1000
eval_iters: 50
out_dir: checkpoints
